<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MotosXR — Comparador 360° + 3D</title>

  <!-- ── Fuentes Apex Precision ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Geist:wght@400;500&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- ── Tailwind CDN ── -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            apex: {
              bg:       '#0b1326',
              surface:  '#131b2e',
              card:     '#171f33',
              high:     '#222a3d',
              highest:  '#2d3449',
              text:     '#dae2fd',
              muted:    '#bdc8d1',
              outline:  '#87929a',
              border:   '#3e484f',
              accent:   '#38bdf8',
              'accent-deep': '#0284c7',
              error:    '#ffb4ab',
            },
          },
          fontFamily: {
            grotesk: ['Space Grotesk', 'sans-serif'],
            geist:   ['Geist', 'sans-serif'],
            mono:    ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>

  <!-- ── model-viewer ── -->
  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"
  ></script>

  <style>
    /* ── Reset / Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0b1326;
      color: #dae2fd;
      font-family: 'Geist', system-ui, sans-serif;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track  { background: #171f33; }
    ::-webkit-scrollbar-thumb  { background: #3e484f; border-radius: 2px; }

    /* ── Scrubber input[range] ── */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 9999px;
      outline: none;
      cursor: pointer;
      background: linear-gradient(to right, #38bdf8 var(--prog, 0%), #3e484f var(--prog, 0%));
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f8fafc;
      border: 2px solid #0b1326;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    input[type="range"]::-webkit-slider-thumb:hover { background: #38bdf8; transform: scale(1.15); }
    input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.2); }
    input[type="range"]::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 50%;
      background: #f8fafc; border: 2px solid #0b1326; cursor: pointer;
    }

    /* ── 360° Viewer cursor ── */
    #viewer360 { cursor: grab; user-select: none; -webkit-user-select: none; }
    #viewer360.grabbing { cursor: grabbing; }

    /* ── Loader spinner ── */
    .loader {
      width: 28px; height: 28px;
      border: 2px solid #3e484f;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── model-viewer overrides ── */
    model-viewer {
      width: 100%; height: 100%;
      background: transparent;
      --poster-color: transparent;
    }

    /* ── Pill buttons ── */
    .pill {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 13px;
      padding: 6px 18px;
      border-radius: 9999px;
      border: 1px solid #3e484f;
      color: #bdc8d1;
      background: transparent;
      cursor: pointer;
      letter-spacing: -0.01em;
      transition: all 0.18s ease;
      white-space: nowrap;
    }
    .pill:hover:not(.active-pill) {
      border-color: #38bdf8;
      color: #38bdf8;
    }
    .pill.active-pill {
      background: #38bdf8;
      border-color: #38bdf8;
      color: #003351;
    }

    /* ── Ghost button ── */
    .ghost-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 9999px;
      border: 1px solid #3e484f;
      color: #87929a;
      background: transparent;
      cursor: pointer;
      transition: all 0.18s;
    }
    .ghost-btn:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }

    /* ── AR button ── */
    .ar-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 9999px;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      background: transparent;
      cursor: pointer;
      transition: all 0.18s;
    }
    .ar-btn:hover { background: #38bdf8; color: #003351; }

    /* ── Panel divider ── */
    .divider {
      width: 1px;
      background: #3e484f;
      position: relative;
      flex-shrink: 0;
      align-self: stretch;
    }
    .divider::after {
      content: '\21CC';          /* ⇌ */
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #222a3d;
      color: #87929a;
      padding: 6px 5px;
      border: 1px solid #3e484f;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1;
    }

    /* ── Label caps ── */
    .label-caps {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .label-accent { color: #38bdf8; }
    .label-muted  { color: #87929a; }

    /* ── Overlay ── */
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px;
      background: #0b1326;
      z-index: 20;
      border-radius: inherit;
      transition: opacity 0.3s;
    }

    /* ── Drag hint ── */
    .drag-hint {
      position: absolute;
      bottom: 12px; left: 14px;
      display: flex; align-items: center; gap: 6px;
      opacity: 0.55;
      pointer-events: none;
      transition: opacity 0.4s;
    }
    .drag-hint.hidden { opacity: 0; }

    /* ── 360 frame image ── */
    #frame360 {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      display: block;
    }

    /* ── Angle badge ── */
    .angle-badge {
      position: absolute;
      top: 12px; right: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: #bdc8d1;
      background: rgba(34,42,61,0.85);
      border: 1px solid #3e484f;
      padding: 3px 8px;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    /* ── Tick labels ── */
    .tick-row {
      display: flex;
      justify-content: space-between;
      padding: 0 2px;
    }
    .tick-row span {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: #3e484f;
      letter-spacing: 0.04em;
    }
  </style>
</head>

<body class="flex flex-col" style="height:100vh;">

  <!-- ══════════════════════ HEADER ══════════════════════ -->
  <header
    class="flex items-center justify-between flex-shrink-0 px-6"
    style="
      height: 56px;
      background: #131b2e;
      border-bottom: 1px solid #3e484f;
    "
  >
    <!-- Brand -->
    <div class="flex items-center gap-3 flex-shrink-0">
      <span
        style="
          font-family:'Space Grotesk',sans-serif;
          font-weight:700; font-size:18px;
          color:#38bdf8; letter-spacing:-0.03em;
        "
      >MOTOS<span style="color:#dae2fd;">XR</span></span>
      <span
        class="label-caps label-muted"
        style="
          padding:2px 7px;
          border:1px solid #3e484f;
          border-radius:4px;
          background:#171f33;
        "
      >360° + 3D</span>
    </div>

    <!-- Bike selector -->
    <nav class="flex items-center gap-2 overflow-x-auto" id="bikeSelector" style="max-width:60%;"></nav>

    <!-- Frame counter -->
    <div
      class="label-caps label-muted flex-shrink-0"
      style="width:86px; text-align:right;"
      id="frameLabel"
    >FRAME 1 / 8</div>
  </header>

  <!-- ══════════════════════ MAIN PANELS ══════════════════════ -->
  <main class="flex flex-1 overflow-hidden" style="min-height:0;">

    <!-- ────────── LEFT: 360° VIEWER ────────── -->
    <section
      class="flex flex-col flex-1 overflow-hidden"
      style="padding:1.25rem; gap:0.75rem; min-width:0;"
    >
      <!-- Panel header -->
      <div class="flex items-center justify-between flex-shrink-0">
        <div class="flex items-center gap-2">
          <span class="label-caps label-accent">Vista 360°</span>
          <span class="label-caps label-muted" style="font-size:9px;">— arrastra para girar</span>
        </div>
        <!-- Keyboard hint -->
        <div class="flex items-center gap-1" style="opacity:0.5;">
          <kbd style="
            font-family:'JetBrains Mono',monospace; font-size:9px; color:#87929a;
            border:1px solid #3e484f; padding:1px 4px; border-radius:3px; background:#171f33;
          ">←</kbd>
          <kbd style="
            font-family:'JetBrains Mono',monospace; font-size:9px; color:#87929a;
            border:1px solid #3e484f; padding:1px 4px; border-radius:3px; background:#171f33;
          ">→</kbd>
        </div>
      </div>

      <!-- Viewer box -->
      <div
        id="viewer360"
        class="flex-1 relative rounded-2xl overflow-hidden"
        style="
          background:#0b1326;
          border:1px solid #3e484f;
          min-height:0;
        "
      >
        <!-- Loading overlay -->
        <div class="overlay" id="overlay360">
          <div class="loader"></div>
          <span class="label-caps label-muted">Cargando frames</span>
        </div>

        <!-- Moto image -->
        <img id="frame360" src="" alt="360 view" draggable="false" />

        <!-- Angle badge -->
        <div class="angle-badge" id="angleBadge">0°</div>

        <!-- Drag hint -->
        <div class="drag-hint" id="dragHint">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#87929a" stroke-width="2" stroke-linecap="round">
            <path d="M5 12h14M5 12l4-4M5 12l4 4M19 12l-4-4M19 12l-4 4"/>
          </svg>
          <span class="label-caps label-muted" style="font-size:9px;">Drag to rotate</span>
        </div>
      </div>

      <!-- Scrubber -->
      <div class="flex-shrink-0" style="padding:0 2px;">
        <input
          type="range"
          id="scrubber"
          min="0" max="7" value="0" step="1"
        />
        <div class="tick-row" style="margin-top:4px;">
          <span>0°</span><span>45°</span><span>90°</span><span>135°</span>
          <span>180°</span><span>225°</span><span>270°</span><span>315°</span>
        </div>
      </div>
    </section>

    <!-- ────────── DIVIDER ────────── -->
    <div class="divider"></div>

    <!-- ────────── RIGHT: 3D VIEWER ────────── -->
    <section
      class="flex flex-col flex-1 overflow-hidden"
      style="padding:1.25rem; gap:0.75rem; min-width:0;"
    >
      <!-- Panel header -->
      <div class="flex items-center justify-between flex-shrink-0">
        <div class="flex items-center gap-2">
          <span class="label-caps label-accent">Modelo 3D</span>
          <span class="label-caps label-muted" style="font-size:9px;">— arrastra para orbitar · scroll para zoom</span>
        </div>
        <button class="ar-btn" id="arBtn">&#x2299; Ver en AR</button>
      </div>

      <!-- 3D box -->
      <div
        class="flex-1 relative rounded-2xl overflow-hidden"
        style="
          background:#0b1326;
          border:1px solid #3e484f;
          min-height:0;
        "
      >
        <!-- Loading overlay -->
        <div class="overlay" id="overlay3d">
          <div class="loader"></div>
          <span class="label-caps label-muted">Cargando modelo 3D</span>
        </div>

        <model-viewer
          id="modelViewer"
          camera-controls
          touch-action="pan-y"
          auto-rotate
          auto-rotate-delay="4000"
          rotation-per-second="15deg"
          environment-image="neutral"
          shadow-intensity="0"
          exposure="1.3"
          min-field-of-view="10deg"
          max-field-of-view="90deg"
        ></model-viewer>

        <!-- 3D bottom hint -->
        <div
          style="
            position:absolute; bottom:12px; left:14px;
            display:flex; align-items:center; gap:6px;
            opacity:0.45; pointer-events:none;
          "
        >
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#87929a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          </svg>
          <span class="label-caps label-muted" style="font-size:9px;">Drag to orbit &middot; Scroll to zoom</span>
        </div>
      </div>

      <!-- Reset camera -->
      <div class="flex-shrink-0 flex justify-center">
        <button class="ghost-btn" id="resetBtn">&#8635; Resetear camara</button>
      </div>
    </section>
  </main>

  <!-- ══════════════════════ JAVASCRIPT ══════════════════════ -->
  <script>
  // ─── BIKE DATA ────────────────────────────────────────────────────────────
  const BIKES = [
    {
      id:    'akt-nkd',
      name:  'AKT NKD',
      folder:'Akt Nkd',
      glb:   'nkd.glb',
      ext:   '_dark.png',
      count:  8,
    },
    {
      id:    'bajaj-boxer',
      name:  'BAJAJ BOXER',
      folder:'Bajaj Boxer',
      glb:   'boxer.glb',
      ext:   '_dark.png',
      count:  8,
    },
    {
      id:    'hero-eco',
      name:  'HERO ECO',
      folder:'Hero eco deluxe',
      glb:   'hero.glb',
      ext:   '_dark.png',        // generado por normalize_backgrounds.py
      count:  8,
    },
    {
      id:    'pulsar-ns200',
      name:  'PULSAR NS200',
      folder:'Pulsar ns 200',
      glb:   'ns200.glb',
      ext:   '_dark.png',
      count:  8,
    },
    {
      id:    'tvs-raider',
      name:  'TVS RAIDER',
      folder:'Tvs raider',
      glb:   'Raider.glb',
      ext:   '_dark.png',
      count:  8,
    },
  ];

  // frame path helper
  function frameSrc(bike, n) {
    return encodeURI(bike.folder + '/' + n + bike.ext);
  }

  // ─── STATE ───────────────────────────────────────────────────────────────
  let activeBike   = 0;
  let curFrame     = 0;
  let cache        = {};   // bikeIdx → [Image, ...]
  let isDragging   = false;
  let dragStartX   = 0;
  let dragBaseFrame= 0;
  let hintHidden   = false;

  const SENSITIVITY = 38;  // px per frame — feeling natural for most screens

  // ─── DOM ─────────────────────────────────────────────────────────────────
  const sel360     = document.getElementById('bikeSelector');
  const viewer360  = document.getElementById('viewer360');
  const img360     = document.getElementById('frame360');
  const scrubber   = document.getElementById('scrubber');
  const overlay360 = document.getElementById('overlay360');
  const overlay3d  = document.getElementById('overlay3d');
  const angleBadge = document.getElementById('angleBadge');
  const frameLabel = document.getElementById('frameLabel');
  const modelV     = document.getElementById('modelViewer');
  const arBtn      = document.getElementById('arBtn');
  const resetBtn   = document.getElementById('resetBtn');
  const dragHint   = document.getElementById('dragHint');

  // ─── BUILD SELECTOR ──────────────────────────────────────────────────────
  function buildSelector() {
    sel360.innerHTML = '';
    BIKES.forEach((bike, idx) => {
      const btn = document.createElement('button');
      btn.textContent = bike.name;
      btn.className   = 'pill' + (idx === activeBike ? ' active-pill' : '');
      btn.addEventListener('click', () => switchBike(idx));
      sel360.appendChild(btn);
    });
  }

  // ─── PRELOAD ─────────────────────────────────────────────────────────────
  function preload(bikeIdx) {
    if (cache[bikeIdx]) return Promise.resolve(cache[bikeIdx]);
    const bike = BIKES[bikeIdx];
    return new Promise(resolve => {
      const imgs = [];
      let done = 0;
      for (let n = 1; n <= bike.count; n++) {
        const im = new Image();
        im.onload  = im.onerror = () => { if (++done === bike.count) { cache[bikeIdx] = imgs; resolve(imgs); } };
        im.src = frameSrc(bike, n);
        imgs.push(im);
      }
    });
  }

  // ─── SWITCH BIKE ─────────────────────────────────────────────────────────
  async function switchBike(idx) {
    activeBike = idx;
    curFrame   = 0;

    // Update pills
    document.querySelectorAll('.pill').forEach((b, i) => {
      b.classList.toggle('active-pill', i === idx);
    });

    // Show loaders
    overlay360.style.opacity = '1';
    overlay360.style.pointerEvents = 'all';
    overlay3d.style.opacity = '1';
    overlay3d.style.pointerEvents = 'all';

    const bike = BIKES[idx];

    // Load 3D model
    modelV.src = encodeURI(bike.folder + '/' + bike.glb);

    // Preload 360 frames
    await preload(idx);

    // Show frame 0
    renderFrame(0);

    // Hide 360 loader
    overlay360.style.opacity = '0';
    overlay360.style.pointerEvents = 'none';

    // Update scrubber max
    scrubber.max = bike.count - 1;
    scrubber.value = 0;
    updateScrubber(0);
  }

  // ─── RENDER FRAME ────────────────────────────────────────────────────────
  function renderFrame(f) {
    const bike  = BIKES[activeBike];
    curFrame    = ((f % bike.count) + bike.count) % bike.count;
    const imgs  = cache[activeBike];

    // Use preloaded image src or direct path
    img360.src  = (imgs && imgs[curFrame] && imgs[curFrame].complete && imgs[curFrame].naturalWidth)
                  ? imgs[curFrame].src
                  : frameSrc(bike, curFrame + 1);

    const deg   = curFrame * Math.round(360 / bike.count);
    angleBadge.textContent = deg + '\u00b0';
    frameLabel.textContent = 'FRAME ' + (curFrame + 1) + ' / ' + bike.count;
    scrubber.value = curFrame;
    updateScrubber(curFrame);
  }

  function updateScrubber(val) {
    const max = BIKES[activeBike].count - 1;
    const pct = max > 0 ? (val / max * 100).toFixed(1) : 0;
    scrubber.style.setProperty('--prog', pct + '%');
  }

  // ─── DRAG — 360° (libre izquierda/derecha) ──────────────────────────────
  function onPointerDown(clientX) {
    isDragging    = true;
    dragStartX    = clientX;
    dragBaseFrame = curFrame;
    viewer360.classList.add('grabbing');
    if (!hintHidden) {
      dragHint.classList.add('hidden');
      hintHidden = true;
    }
  }

  function onPointerMove(clientX) {
    if (!isDragging) return;
    // deltaX > 0 → drag right → +frames (gira hacia la derecha)
    // deltaX < 0 → drag left  → -frames (gira hacia la izquierda)
    const delta      = clientX - dragStartX;
    const frameDelta = Math.round(delta / SENSITIVITY);
    if (frameDelta !== 0) {
      renderFrame(dragBaseFrame + frameDelta);
    }
  }

  function onPointerUp() {
    if (!isDragging) return;
    isDragging = false;
    // Snap dragBase to current so next drag starts from here
    dragBaseFrame = curFrame;
    dragStartX    = 0;
    viewer360.classList.remove('grabbing');
  }

  // ── Mouse ──
  viewer360.addEventListener('mousedown', e => { e.preventDefault(); onPointerDown(e.clientX); });
  document.addEventListener('mousemove',  e => onPointerMove(e.clientX));
  document.addEventListener('mouseup',    () => onPointerUp());

  // ── Touch ──
  viewer360.addEventListener('touchstart', e => {
    e.preventDefault();
    onPointerDown(e.touches[0].clientX);
  }, { passive: false });
  viewer360.addEventListener('touchmove', e => {
    e.preventDefault();
    onPointerMove(e.touches[0].clientX);
  }, { passive: false });
  viewer360.addEventListener('touchend', () => onPointerUp());

  // ─── SCRUBBER sync ───────────────────────────────────────────────────────
  scrubber.addEventListener('input', e => {
    renderFrame(+e.target.value);
    dragBaseFrame = curFrame;  // keep drag base in sync
  });

  // ─── 3D MODEL events ─────────────────────────────────────────────────────
  modelV.addEventListener('load', () => {
    overlay3d.style.opacity = '0';
    overlay3d.style.pointerEvents = 'none';
  });
  modelV.addEventListener('error', () => {
    overlay3d.innerHTML =
      '<span class="label-caps label-muted">Error al cargar el modelo</span>';
  });

  // ─── AR button ───────────────────────────────────────────────────────────
  arBtn.addEventListener('click', () => {
    if (modelV.canActivateAR) {
      modelV.activateAR();
    } else {
      const orig = arBtn.textContent;
      arBtn.textContent = '\u26A0 HTTPS + movil requerido';
      arBtn.style.borderColor = '#ffb4ab';
      arBtn.style.color       = '#ffb4ab';
      setTimeout(() => {
        arBtn.textContent    = '\u2299 Ver en AR';
        arBtn.style.borderColor = '#38bdf8';
        arBtn.style.color       = '#38bdf8';
      }, 2800);
    }
  });

  // ─── Reset camera ────────────────────────────────────────────────────────
  resetBtn.addEventListener('click', () => {
    modelV.cameraOrbit  = 'auto auto auto';
    modelV.cameraTarget = 'auto auto auto';
    modelV.fieldOfView  = 'auto';
    try { modelV.resetTurntableRotation(0); } catch(_) {}
  });

  // ─── Keyboard shortcuts ───────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    const bike = BIKES[activeBike];
    switch (e.key) {
      case 'ArrowRight': renderFrame(curFrame + 1); dragBaseFrame = curFrame; break;
      case 'ArrowLeft':  renderFrame(curFrame - 1); dragBaseFrame = curFrame; break;
      case '1': case '2': case '3': case '4': case '5':
        switchBike(+e.key - 1);
        break;
    }
  });

  // ─── INIT ────────────────────────────────────────────────────────────────
  buildSelector();
  switchBike(0);
  </script>
</body>
</html>
